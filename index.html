<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SplitEasy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f6;--card:#fff;--text:#14213d;--muted:#6a7590;--line:#dde2ec;--accent:#3a5bff;--ink:#fff;--pos:#0f8a5f;--neg:#d6453d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--text:#e9edf8;--muted:#8d99b8;--line:#27314d;--accent:#6c85ff;--ink:#0b1022;--pos:#3fd49c;--neg:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--text:#e9edf8;--muted:#8d99b8;--line:#27314d;--accent:#6c85ff;--ink:#0b1022;--pos:#3fd49c;--neg:#ff7a70;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0}
select,input[type=text],input[type=number]{font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
select.cur{width:auto;padding:6px 8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--card);border-radius:14px;padding:4px;margin-bottom:16px;border:1px solid var(--line)}
nav button{font:inherit;font-weight:600;font-size:13px;border:0;background:none;color:var(--muted);padding:10px 2px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--accent);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.row{display:flex;gap:8px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--ink);cursor:pointer}
.btn.full{width:100%;margin-top:14px}
.btn.ghost{background:none;color:var(--muted);border:1.5px solid var(--line)}
.btn.danger{background:var(--neg);color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.sub{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:block;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pos{color:var(--pos);font-weight:800}.neg{color:var(--neg);font-weight:800}
.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.err{color:var(--neg);font-size:14px;margin-top:10px;min-height:1em}
.pay{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.pay b{font-weight:800}
.amt{margin-left:auto;font-weight:800;font-size:18px}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.gbar:empty{display:none}.gbar b{letter-spacing:.12em;font-size:18px}.gbar span:last-child{display:flex;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;max-width:90%;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);padding:3px;border-radius:12px}
.seg button{font:inherit;font-weight:600;font-size:14px;border:0;background:none;color:var(--muted);padding:9px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 0 0 1.5px var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.b{background:var(--pos)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.person{padding:12px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.paid{color:var(--pos)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
</style>
</head>
<body>
<main>
<header><h1>SplitEasy</h1><select class="cur" id="cur" aria-label="Currency"><option>₹</option><option>$</option><option>€</option><option>£</option></select></header>
<div id="gbar"></div>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const blank=()=>({people:[],exp:[],pay:[],cur:'₹'});
let S=blank(),tab='people',armed=false,mode='equal',CODE=null;
try{CODE=localStorage.getItem('splitease_code')}catch(e){}
const remember=c=>{try{c?localStorage.setItem('splitease_code',c):localStorage.removeItem('splitease_code')}catch(e){}};
async function api(body){const r=await fetch('/api/group',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Something went wrong. Try again.');return j}
let tt;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3500)}
async function op(name,data){try{const r=await api({op:name,code:CODE,data});S=r.state;render();return true}catch(e){toast(e.message);return false}}
function enter(code,state){CODE=code;remember(code);S=Object.assign(blank(),state);tab='people';armed=false;render()}
function leave(){CODE=null;remember(null);S=blank();render()}
function gbar(){$('#gbar').innerHTML=`<span>Group code <b>${CODE}</b></span><span><button class="btn ghost sm" id="gi">Invite</button><button class="btn ghost sm" id="gl">Leave</button></span>`;
 $('#gi').onclick=async()=>{const text=`Join our SplitEasy group: ${location.origin} and enter code ${CODE}`;
  try{if(navigator.share){await navigator.share({text});return}await navigator.clipboard.writeText(text);toast('Invite copied')}catch(e){if(e.name!=='AbortError')toast('Share this code: '+CODE)}};
 $('#gl').onclick=leave}
function landing(){$('#nav').innerHTML='';$('#gbar').innerHTML='';$('#cur').style.display='none';
 $('#view').innerHTML=`<div class="card"><h2>Start a new group</h2><div class="sub">You get a 5-digit code. Share it so everyone sees the same expenses.</div><button class="btn full" id="mk">Create group</button></div>
 <div class="card"><h2>Join with a code</h2><input type="text" id="jc" inputmode="numeric" maxlength="5" placeholder="12345" autocomplete="off" aria-label="Group code" style="font-size:24px;letter-spacing:.3em;text-align:center"><button class="btn full" id="jn">Join group</button><div class="err" id="err"></div></div>`;
 $('#mk').onclick=async()=>{$('#mk').disabled=true;try{const r=await api({op:'create'});enter(r.code,r.state)}catch(e){$('#mk').disabled=false;toast(e.message)}};
 const join=async()=>{const c=$('#jc').value.trim();try{const r=await api({op:'get',code:c});enter(c,r.state)}catch(e){$('#err').textContent=e.message}};
 $('#jn').onclick=join;$('#jc').onkeydown=e=>{if(e.key==='Enter')join()}}
async function boot(){if(!CODE){render();return}
 $('#view').innerHTML='<div class="empty">Loading…</div>';
 try{const r=await api({op:'get',code:CODE});S=r.state;render()}
 catch(e){if(/No group/.test(e.message)){CODE=null;remember(null);render();toast(e.message);return}
  $('#view').innerHTML=`<div class="card empty">Couldn’t reach the server.<button class="btn full" id="rt">Try again</button><button class="btn ghost full" id="lv">Leave group</button></div>`;$('#rt').onclick=boot;$('#lv').onclick=leave}}
async function poll(){if(!CODE||document.hidden)return;try{const r=await api({op:'get',code:CODE});
 if(JSON.stringify(r.state)!==JSON.stringify(S)){S=r.state;const a=document.activeElement;if(tab!=='add'&&!(a&&/INPUT|SELECT/.test(a.tagName)))render()}}catch(e){}}
setInterval(poll,6000);document.addEventListener('visibilitychange',poll);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>esc((S.people.find(p=>p.id===id)||{name:'Someone'}).name);
const money=c=>S.cur+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
// Parse decimal text directly into whole paise (or hundredths of a percent).
const MAX_UNITS=999999999999;
function units(value,blankIsZero=false){
 const text=String(value).trim();if(!text)return blankIsZero?0:NaN;
 if(!/^(?:\d+(?:\.\d{0,2})?|\.\d{1,2})$/.test(text))return NaN;
 const [whole,fraction='']=text.split('.'),n=Number((whole||'0')+fraction.padEnd(2,'0'));
 return Number.isSafeInteger(n)&&n<=MAX_UNITS?n:NaN;
}
function percentageShares(a,values){
 const rows=values.map(([id,bp],index)=>{const product=BigInt(a)*BigInt(bp);return{id,index,amount:Number(product/10000n),remainder:Number(product%10000n)}});
 const remaining=a-rows.reduce((sum,row)=>sum+row.amount,0);
 const ranked=[...rows].sort((x,y)=>y.remainder-x.remainder||x.index-y.index);
 for(let i=0;i<remaining;i++)ranked[i].amount++;
 return rows.map(row=>[row.id,row.amount]);
}
function shares(e){if(e.sh)return e.sh;const n=e.sp.length,b=Math.floor(e.a/n),r=e.a-b*n;return e.sp.map((id,i)=>[id,b+(i<r?1:0)])}
function ledgerIssues(){
 const ids=new Set(S.people.map(p=>p.id)),issues=[];
 for(const e of S.exp){
  const sh=Array.isArray(e.sh)?e.sh:Array.isArray(e.sp)&&e.sp.length?shares(e):[];
  if(!Number.isSafeInteger(e.a)||e.a<=0||!ids.has(e.p)||!sh.length||
   sh.some(row=>!Array.isArray(row)||!ids.has(row[0])||!Number.isSafeInteger(row[1])||row[1]<0)||
   new Set(sh.map(row=>row[0])).size!==sh.length||sh.reduce((sum,row)=>sum+row[1],0)!==e.a)
   issues.push(`Check expense “${e.d}”: its shares must add up to its amount. Delete and re-enter it in History.`);
 }
 if(S.pay.some(p=>!ids.has(p.from)||!ids.has(p.to)||p.from===p.to||!Number.isSafeInteger(p.a)||p.a<=0))issues.push('A saved payment is invalid. Undo it in Payments made.');
 if(!Number.isSafeInteger(S.exp.reduce((sum,e)=>sum+e.a,0)+S.pay.reduce((sum,p)=>sum+p.a,0)))issues.push('The group total is too large to calculate safely.');
 return issues;
}
function balances(){const n={};S.people.forEach(p=>n[p.id]=0);
 S.exp.forEach(e=>{n[e.p]=(n[e.p]||0)+e.a;shares(e).forEach(([id,s])=>n[id]=(n[id]||0)-s)});
 S.pay.forEach(p=>{n[p.from]=(n[p.from]||0)+p.a;n[p.to]=(n[p.to]||0)-p.a});return n}
const CATS=['Food','Travel','Stay','Shopping','Fun','Other'],CI={Food:'🍽️',Travel:'🚕',Stay:'🏨',Shopping:'🛍️',Fun:'🎉',Other:'🧾'};
function stats(){const st={};S.people.forEach(p=>st[p.id]={paid:0,share:0,sent:0,got:0});
 S.exp.forEach(e=>{if(st[e.p])st[e.p].paid+=e.a;shares(e).forEach(([id,s])=>{if(st[id])st[id].share+=s})});
 S.pay.forEach(p=>{if(st[p.from])st[p.from].sent+=p.a;if(st[p.to])st[p.to].got+=p.a});return st}
function settle(){if(ledgerIssues().length)return [];const n=balances(),c=[],d=[],out=[];
 for(const id in n){if(n[id]>0)c.push([id,n[id]]);else if(n[id]<0)d.push([id,-n[id]])}
 while(c.length&&d.length){c.sort((x,y)=>y[1]-x[1]);d.sort((x,y)=>y[1]-x[1]);
  const m=Math.min(c[0][1],d[0][1]);out.push({from:d[0][0],to:c[0][0],amt:m});c[0][1]-=m;d[0][1]-=m;
  if(!c[0][1])c.shift();if(!d[0][1])d.shift()}
 return out}
const tabs=[['people','People'],['add','Add'],['hist','History'],['sum','Summary'],['settle','Settle']];
function go(t){tab=t;armed=false;render()}
function render(){if(!CODE){landing();return}$('#cur').style.display='';
 $('#cur').value=S.cur;gbar();
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
 ({people:vPeople,add:vAdd,hist:vHist,sum:vSum,settle:vSettle})[tab]();
}
/* People */
function vPeople(){
 const used=new Set([...S.exp.flatMap(e=>[e.p,...e.sp]),...S.pay.flatMap(p=>[p.from,p.to])]);
 $('#view').innerHTML=`<div class="card"><h2>Who’s in the group?</h2>
 <div class="row"><input type="text" id="pn" placeholder="Name" maxlength="30" autocomplete="off"><button class="btn" id="pa">Add</button></div>
 <div class="err" id="err"></div>
 ${S.people.length?S.people.map(p=>`<div class="item"><span>${esc(p.name)}</span>${used.has(p.id)?'<span class="sub">in expenses</span>':`<button class="x" data-r="${p.id}" aria-label="Remove ${esc(p.name)}">×</button>`}</div>`).join(''):'<div class="empty">Add at least two people to start splitting.</div>'}</div>`;
 const add=()=>{const v=$('#pn').value.trim();if(!v)return;
  if(S.people.some(p=>p.name.toLowerCase()===v.toLowerCase())){$('#err').textContent='That name is already in the group.';return}
  $('#pn').value='';op('addPerson',{id:uid(),name:v}).then(()=>{const i=$('#pn');if(i)i.focus()})};
 $('#pa').onclick=add;$('#pn').onkeydown=e=>{if(e.key==='Enter')add()};
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{op('removePerson',{id:b.dataset.r})});
}
/* Add */
function vAdd(){
 if(S.people.length<2){$('#view').innerHTML=`<div class="card empty">Add at least two people first.<br><button class="btn full" id="gp">Go to People</button></div>`;$('#gp').onclick=()=>go('people');return}
 $('#view').innerHTML=`<div class="card"><h2>New expense</h2>
 <label for="d">What was it for?</label><input type="text" id="d" placeholder="Dinner, cab, groceries…" maxlength="60" autocomplete="off">
 <label for="a">Amount</label><input type="number" id="a" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
 <label for="p">Paid by</label><select id="p">${S.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
 <label for="c">Category</label><select id="c">${CATS.map(c=>`<option value="${c}">${CI[c]} ${c}</option>`).join('')}</select><label>Split</label><div class="seg" id="seg"><button data-m="equal">Equally</button><button data-m="exact">Exact amounts</button><button data-m="pct">Percent</button></div><div id="box" style="margin-top:12px"></div>
 <div class="sub" id="pv" style="margin-top:10px"></div><div class="err" id="err"></div>
 <button class="btn full" id="sv">Save expense</button></div>`;
 mode='equal';const box=$('#box');
 const draw=()=>{
  $('#seg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  box.innerHTML=mode==='equal'?`<div class="chips">${S.people.map(p=>`<label class="chip"><input type="checkbox" value="${p.id}" checked><span>${esc(p.name)}</span></label>`).join('')}</div>`
   :S.people.map(p=>`<div class="item"><span>${esc(p.name)}</span><input type="number" inputmode="decimal" step="0.01" min="0" data-s="${p.id}" aria-label="${esc(p.name)} ${mode==='pct'?'percentage':'share'}" placeholder="${mode==='pct'?'0 %':'0.00'}" style="width:110px"></div>`).join('');
  box.querySelectorAll('input').forEach(i=>{i.oninput=pv;i.onchange=pv});pv()};
 const calc=a=>{
  if(mode==='equal'){const ids=[...box.querySelectorAll('input:checked')].map(i=>i.value);return ids.length?{sh:shares({a,sp:ids})}:{err:'Pick at least one person to split with.'}}
  const inputs=[...box.querySelectorAll('[data-s]')];
  const parsed=inputs.map(i=>[i.dataset.s,i.validity.badInput?NaN:units(i.value,true)]);
  if(parsed.some(x=>!Number.isFinite(x[1])))return{err:'Use non-negative numbers with at most two decimal places for every share.'};
  const v=parsed.filter(x=>x[1]>0);
  if(!v.length)return{err:'Enter a value for at least one person.'};
  const t=v.reduce((sum,x)=>sum+x[1],0);
  if(mode==='exact')return t===a?{sh:v}:{err:`Amounts add up to ${money(t)}, but the expense is ${money(a)}.`};
  if(t!==10000)return{err:`Percentages add up to ${t/100}%, they need to total exactly 100%.`};
  return{sh:percentageShares(a,v)}};
 const pv=()=>{const a=units($('#a').value);$('#err').textContent='';if(!(a>0)){$('#pv').textContent=$('#a').value?'Enter a positive amount with at most two decimal places.':'';return}
  const r=calc(a);$('#pv').innerHTML=r.sh?r.sh.map(([id,s])=>`${nm(id)} ${money(s)}`).join(' · '):esc(r.err)};
 $('#a').oninput=pv;
 $('#seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
 $('#sv').onclick=()=>{
  const d=$('#d').value.trim(),a=units($('#a').value),p=$('#p').value;
  if(!d){$('#err').textContent='Add a description.';return}
  if(!(a>0)){$('#err').textContent=`Enter an amount above zero, with at most two decimal places and no more than ${money(MAX_UNITS)}.`;return}
  if(S.exp.reduce((sum,e)=>sum+e.a,0)+a>MAX_UNITS){$('#err').textContent='This expense would exceed the supported group total.';return}
  const r=calc(a);if(r.err){$('#err').textContent=r.err;return}
  if(r.sh.reduce((sum,x)=>sum+x[1],0)!==a){$('#err').textContent='The shares must add up to the expense amount.';return}
  op('addExpense',{id:uid(),d,a,p,c:$('#c').value,sh:r.sh}).then(ok=>{if(ok)go('hist')})};
 draw();
}
/* History */
function vHist(){
 $('#view').innerHTML=`<div class="card"><h2>Expenses</h2>${S.exp.length?S.exp.map(e=>`<div class="item"><div><div><b>${CI[e.c]||'🧾'} ${esc(e.d)}</b></div><div class="sub">${nm(e.p)} paid · split ${e.sp.length===S.people.length?'with everyone':'between '+e.sp.map(nm).join(', ')}</div></div><div style="display:flex;align-items:center"><b>${money(e.a)}</b><button class="x" data-x="${e.id}" aria-label="Delete ${esc(e.d)}">×</button></div></div>`).join(''):'<div class="empty">No expenses yet. Add your first one.</div>'}</div>`;
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{op('delExpense',{id:b.dataset.x})});
}
/* Summary */
function vSum(){
 const issues=ledgerIssues();if(issues.length){$('#view').innerHTML=`<div class="card"><h2>Check saved entries</h2>${issues.map(issue=>`<p class="err">${esc(issue)}</p>`).join('')}<button class="btn full" id="fix">Go to History</button></div>`;$('#fix').onclick=()=>go('hist');return}
 const st=stats(),total=S.exp.reduce((s,e)=>s+e.a,0),mx=Math.max(1,...S.people.map(p=>Math.max(st[p.id].paid,st[p.id].share)));
 const cat={};S.exp.forEach(e=>{const c=e.c||'Other';cat[c]=(cat[c]||0)+e.a});
 const ce=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
 $('#view').innerHTML=`<div class="grid2" style="margin-bottom:14px"><div class="stat"><span class="sub">Group total</span><b>${money(total)}</b></div><div class="stat"><span class="sub">Expenses</span><b>${S.exp.length}</b></div></div>
 <div class="card"><h2>Paid vs. actual spend</h2><div class="sub">Paid upfront is what each person paid for expenses. Actual spend is their share. The balance beside each name includes payments already marked paid and shows what is still owed.</div>
 ${S.people.map(p=>{const s=st[p.id],d=s.paid-s.share+s.sent-s.got;return `<div class="person"><div class="item" style="border:0;padding:0"><b>${esc(p.name)}</b><span class="${d>0?'pos':d<0?'neg':'sub'}">${d>0?'gets back '+money(d):d<0?'owes '+money(-d):'settled'}</span></div>
 <div class="sub" style="margin-top:4px">Paid upfront ${money(s.paid)}</div><div class="bar"><i class="b" style="width:${s.paid/mx*100}%"></i></div>
 <div class="sub" style="margin-top:6px">Actual spend ${money(s.share)}</div><div class="bar"><i style="width:${s.share/mx*100}%"></i></div>
 ${s.sent||s.got?`<div class="sub" style="margin-top:6px">Settled so far: sent ${money(s.sent)}, received ${money(s.got)}</div>`:''}</div>`}).join('')||'<div class="empty">Add people and expenses first.</div>'}</div>
 <div class="card"><h2>By category</h2>${ce.length?ce.map(([c,v])=>`<div class="person" style="padding:8px 0"><div class="item" style="border:0;padding:0"><span>${CI[c]||'🧾'} ${c}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/total*100}%"></i></div></div>`).join(''):'<div class="empty">No expenses yet.</div>'}</div>`;
}
/* Settle */
function vSettle(){
 const issues=ledgerIssues(),n=issues.length?{}:balances(),t=settle(),total=S.exp.reduce((s,e)=>s+e.a,0);
 const allSettled=!issues.length&&Object.values(n).every(v=>v===0);
 $('#view').innerHTML=`<div class="card"><h2>Who pays whom</h2>${issues.length?issues.map(issue=>`<p class="err">${esc(issue)}</p>`).join(''):t.length?t.map(x=>`<div class="pay"><span><b>${nm(x.from)}</b> pays <b>${nm(x.to)}</b></span><span class="amt">${money(x.amt)}</span><button class="btn sm" data-pp="${x.from}|${x.to}|${x.amt}">Mark paid</button></div>`).join(''):`<div class="empty">${allSettled&&(S.exp.length||S.pay.length)?'Everyone is settled up.':'Add some expenses to see the settlement.'}</div>`}</div>
 ${issues.length?'':`<div class="card"><h2>Balances</h2><div class="sub" style="margin-bottom:6px">Total spent: ${money(total)}</div>${S.people.map(p=>{const v=n[p.id]||0;return `<div class="item"><span>${esc(p.name)}</span><span class="${v>0?'pos':v<0?'neg':'sub'}">${v>0?'gets back '+money(v):v<0?'owes '+money(-v):'settled'}</span></div>`}).join('')||'<div class="empty">No people yet.</div>'}</div>`}
 ${S.pay.length?`<div class="card"><h2>Payments made</h2>${S.pay.map(p=>`<div class="item"><span><b>${nm(p.from)}</b> paid <b>${nm(p.to)}</b><div class="sub">${new Date(p.t).toLocaleDateString()}</div></span><span><b class="paid">${money(p.a)}</b><button class="x" data-up="${p.id}" aria-label="Undo payment">↶</button></span></div>`).join('')}</div>`:''}
 <button class="btn full" id="cp">Copy summary to share</button>
 <button class="btn ${armed?'danger':'ghost'} full" id="rs">${armed?'Tap again to delete everything':'Clear all data in this group'}</button>`;
 document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{const[f,t2,a]=b.dataset.pp.split('|');if(!settle().some(x=>x.from===f&&x.to===t2&&x.amt===+a)){render();return}op('addPay',{id:uid(),from:f,to:t2,a:+a})});
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{op('delPay',{id:b.dataset.up})});
 $('#cp').disabled=issues.length>0;
 $('#cp').onclick=async()=>{
  if(ledgerIssues().length)return;
  const rn=id=>(S.people.find(p=>p.id===id)||{name:'Someone'}).name,st=stats();
  const txt=['SplitEasy summary','Total spent: '+money(total),'','Who pays whom:',...(t.length?t.map(x=>`- ${rn(x.from)} pays ${rn(x.to)} ${money(x.amt)}`):['- All settled']),'','Actual spend per person:',...S.people.map(p=>`- ${p.name}: ${money(st[p.id].share)} (paid upfront ${money(st[p.id].paid)})`)].join('\n');
  try{await navigator.clipboard.writeText(txt);$('#cp').textContent='Copied ✓'}catch(e){if(!$('#ta'))$('#cp').insertAdjacentHTML('afterend',`<textarea id="ta" readonly rows="9" style="width:100%;margin-top:10px;font:inherit;border-radius:12px;padding:10px;background:var(--card);color:var(--text);border:1.5px solid var(--line)">${esc(txt)}</textarea>`);$('#ta').select()}};
 $('#rs').onclick=()=>{if(!armed){armed=true;vSettle();return}op('reset',{}).then(()=>go('people'))};
}
$('#cur').onchange=e=>{op('setCur',{cur:e.target.value})};
boot();
</script>
</body>
</html>
